[project]
name = "voting-nli"
version = "0.1.0"
description = "Multilingual voting booklet fact-checking and verified dialogue generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "args>=0.1.0",
    "openai>=3.45.0",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
voting-nli = "voting_nli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
